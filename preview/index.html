<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRICKS map style</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
<style>
  :root { --lilac:#dec0f1; --violet:#7161ef; --pink:#ff285e; --green:#34ea82; --yellow:#fff35e; --ink:#1d1d1b; }
  html, body { margin: 0; height: 100%; font-family: 'Source Sans 3', system-ui, sans-serif; color: var(--ink); background: #fbf8fd; }
  #map { position: absolute; inset: 0; }
  .panel { position: absolute; left: 16px; top: 16px; z-index: 2; background: #fff; border-radius: 18px; padding: 14px; box-shadow: 0 8px 30px rgba(73,53,234,.15); display: flex; flex-direction: column; gap: 8px; max-width: 240px; }
  .panel h1 { margin: 0 0 4px; font: 800 18px 'Archivo', sans-serif; }
  .panel button { font: 600 15px 'Source Sans 3', sans-serif; text-align: left; border: 1px solid var(--ink); background: #fff; border-radius: 999px; padding: 8px 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .panel button:hover, .panel button[aria-pressed="true"] { background: var(--lilac); }
  .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); box-sizing: border-box; flex-shrink: 0; }
  .station { width: 30px; height: 30px; border-radius: 50%; border: 4px solid var(--ink); box-sizing: border-box; cursor: pointer; }
  .station.event { width: 40px; height: 40px; border-width: 5px; box-shadow: 0 0 0 6px rgba(255,40,94,.18); }
  .maplibregl-popup-content { border-radius: 14px; font: 15px 'Source Sans 3', sans-serif; padding: 12px 14px; }
  .maplibregl-popup-content b { font: 800 17px 'Archivo', sans-serif; display: block; }
</style>
</head>
<body>
<div id="map" role="region" aria-label="Map of the BRICKS pilot cities"></div>
<nav class="panel" aria-label="Map views">
  <h1>BRICKS map</h1>
  <button type="button" data-view="europe" aria-pressed="true"><span class="dot" style="background: var(--violet)"></span>All pilots</button>
  <button type="button" data-view="aberdeen"><span class="dot" style="background: var(--green)"></span>Aberdeen</button>
  <button type="button" data-view="cluj"><span class="dot" style="background: var(--pink)"></span>Cluj-Napoca</button>
  <button type="button" data-view="marseille"><span class="dot" style="background: var(--pink)"></span>Marseille</button>
  <button type="button" data-view="tallinn"><span class="dot" style="background: var(--green)"></span>Tallinn</button>
  <button type="button" data-view="valladolid"><span class="dot" style="background: var(--yellow)"></span>Valladolid</button>
  <button type="button" data-view="brussels"><span class="dot" style="background: var(--pink); border-radius: 3px"></span>Event in Brussels</button>
  <p style="margin: 6px 0 0; font-size: 13px; line-height: 1.4;"><a href="https://github.com/lisboncouncil/bricks-map-style" style="color: #4935ea;">Source and licence</a> · style CC BY 4.0, The Lisbon Council 2026</p>
</nav>
<script>
  // Approximate city-centre coordinates, to be replaced with the exact lab locations.
  const PLACES = {
    aberdeen:   { name: 'Aberdeen', sub: 'Countesswells Circular Neighbourhood Hub', ll: [-2.1943, 57.1497], color: '#34ea82', z: 13 },
    cluj:       { name: 'Cluj-Napoca', sub: 'The Community Mobility Hub', ll: [23.5899, 46.7694], color: '#ff285e', z: 13 },
    marseille:  { name: 'Marseille', sub: 'Low-Carbon Cargo and Cycling Hub', ll: [5.3698, 43.2965], color: '#ff285e', z: 14 },
    tallinn:    { name: 'Tallinn', sub: 'Kopli 93 Circularity and Craft Hub', ll: [24.7536, 59.4370], color: '#34ea82', z: 13 },
    valladolid: { name: 'Valladolid', sub: 'The Energy and Water Community Cooperative', ll: [-4.7245, 41.6523], color: '#fff35e', z: 14 },
    brussels:   { name: '[Event venue]', sub: '[Street, Brussels]', ll: [4.3786, 50.8433], color: '#ff285e', z: 15.5, event: true }
  };
  const params = new URLSearchParams(location.search);
  const map = new maplibregl.Map({
    container: 'map',
    style: params.get('style') || 'bricks-style.json',
    center: [9, 50], zoom: 3.6, attributionControl: { compact: false }
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
  Object.entries(PLACES).forEach(([key, p]) => {
    const el = document.createElement('button');
    el.className = 'station' + (p.event ? ' event' : '');
    el.style.background = p.color;
    el.setAttribute('aria-label', p.name);
    new maplibregl.Marker({ element: el }).setLngLat(p.ll)
      .setPopup(new maplibregl.Popup({ offset: 20 }).setHTML(`<b>${p.name}</b>${p.sub}`)).addTo(map);
  });
  const go = (view, animate = true) => {
    document.querySelectorAll('.panel button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === view));
    const opts = view === 'europe' ? { center: [9, 50], zoom: 3.6 } : { center: PLACES[view].ll, zoom: PLACES[view].z };
    animate ? map.flyTo({ ...opts, speed: 1.4 }) : map.jumpTo(opts);
  };
  document.querySelectorAll('.panel button').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));
  if (params.get('view')) map.once('load', () => go(params.get('view'), false));
  if (params.get('nopanel')) document.querySelector('.panel').style.display = 'none';
</script>
</body>
</html>
