name: Validate style

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=optional --no-audit --no-fund
      - run: npm run validate
      - run: python3 scripts/make_style.py && git diff --exit-code style/bricks-style.json
